name: Verify schema

on:
  pull_request:
    branches:
      - master
      - development

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check npm release-age support
        run: |
          version="$(npm --version)"
          node -e '
            const version = process.argv[1];
            const [major, minor] = version.split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 10)) {
              console.error(`npm >=11.10.0 is required for min-release-age; got ${version}`);
              process.exit(1);
            }
            console.log(`npm ${version} supports min-release-age`);
          ' "$version"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Audit dependencies
        # image-size <= 2.0.2 (the latest release) carries two unfixable
        # high-severity DoS advisories in parsers this repo never feeds
        # (ICNS/JXL/HEIF); allowlist them so the gate stays live for
        # everything else and self-heals once a patched release ships.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run audit:ci

      - name: Run verify.js
        run: node verify.js

      - name: Lint
        run: npm run biome
